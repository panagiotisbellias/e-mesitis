name: Dependency Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency‑check/Dependency‑Check_Action@main
        with:
          project: "e-mesitis"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --scan ./lib
            --enableRetired
