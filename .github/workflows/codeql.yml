name: CodeQL

on:
  push:
    branches: [ "main", "development", "release/v2.0.0", "task/dependabot-sast-automated-dependency-updates-and-security-checks-6f2rh2P7Fgr7gpm6" ]
  pull_request:
    branches: [ "main", "development", "release/v2.0.0", "task/dependabot-sast-automated-dependency-updates-and-security-checks-6f2rh2P7Fgr7gpm6" ]
  schedule:
    - cron: '0 3 * * 1' # Weekly scan

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build with Ant
        run: |
          ant compile || true
        # ^ allow scan even if build fails (common for legacy code)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
